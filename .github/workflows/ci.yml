name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Runner GitHub-hosted (repo ca nhan khong dung duoc pool self-hosted cohort3 cua org - ADR-0014).
defaults:
  run:
    shell: bash

jobs:
  lint-and-test:
    # GitHub-hosted runner (ADR-0014)
    runs-on: ubuntu-latest

    # Bo test dung Postgres that (settings.database_url mac dinh
    # postgresql://vmec:vmec@localhost:5432/vmec04). Truoc day runner self-hosted
    # khong co DB nen job nay do tu lau - xem ghi chu o golden-smoke ben duoi.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vmec
          POSTGRES_PASSWORD: vmec
          POSTGRES_DB: vmec04
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Workspace không được tạo lại như máy ảo hosted. Xoá rác trước khi checkout
      # để cache/bytecode của lần chạy trước không làm lệch kết quả test.
      - name: Clean stale workspace artifacts
        run: |
          rm -rf .pytest_cache .ruff_cache node_modules
          find . -path ./.git -prune -o -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

      - name: Verify runner toolchain
        run: |
          missing=""
          for tool in git curl; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::Self-hosted runner thiếu:$missing. Cài sẵn trên máy rồi chạy lại."
            exit 1
          fi
          # setup-python tải bản 3.11 nếu máy ra được internet; máy bị chặn mạng
          # ngoài thì phải cài sẵn Python, nên chỉ cảnh báo chứ không fail ở đây.
          command -v python >/dev/null 2>&1 ||
            echo "::warning::Không thấy Python có sẵn — setup-python sẽ phải tải về."

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --default-timeout=100 --retries 5 -r requirements.txt

      # backend/vlm_demthuoc/ co requirements.txt rieng (.railwayignore loai no
      # khoi backend deploy - khong module nao trong backend/api|agents|services
      # import no). tests/vlm_demthuoc/ va test_vlm_prompts_dong_bo.py van can
      # opencv-python/numpy cua no de import duoc, nen cai them o day thay vi
      # gop vao requirements.txt goc.
      - name: Install vlm_demthuoc tool dependencies (for its tests)
        run: pip install --default-timeout=100 --retries 5 -r backend/vlm_demthuoc/requirements.txt

      - name: Lint with ruff
        run: ruff check backend/ tests/

      # Tesseract cho cac test OCR anh thuoc (giong Dockerfile backend).
      - name: Install Tesseract OCR
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng tesseract-ocr-vie

      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://vmec:vmec@localhost:5432/vmec04
          APP_ENV: test
          INTERNAL_AUTH_SECRET: test-internal-secret-for-ci-testing-only
          JWT_SECRET: test-jwt-secret-for-ci-testing-only

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql://vmec:vmec@localhost:5432/vmec04
          APP_ENV: test
          OPENAI_API_KEY: test-key
          INTERNAL_AUTH_SECRET: test-internal-secret-for-ci-testing-only
          JWT_SECRET: test-jwt-secret-for-ci-testing-only

  # BUILD-35: a new, separate, minimal job -- deliberately NOT folded into
  # lint-and-test above. That job has no Postgres service block at all (see
  # its own history/PR discussion) and this repo's own standing note is that
  # it has been broken for a while; fixing it is out of this build's scope
  # (BUILD-32-TO-36-MASTER-PLAN.md's own "do not silently expand a build's
  # scope" rule). This job only runs the golden-set categories whose real
  # grading contract asserts zero model calls
  # (scripts/agent_v2/run_golden_evaluation.py's own
  # _DETERMINISTIC_CATEGORIES) -- schedule/triage/dose-safety/safety-
  # escalation/out-of-scope/auth-isolation -- so it needs a real Postgres
  # instance (Agent V2 durably writes AgentRun/AgentRunEvaluation/
  # AgentSafetyEvent) but explicitly never a paid model credential
  # (OPENAI_API_KEY stays the same fake test-key lint-and-test already uses;
  # deterministic paths never reach the model gateway -- see BUILD-35's own
  # report for the verification of this claim).
  golden-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: golden_ci
          POSTGRES_PASSWORD: golden_ci
          POSTGRES_DB: golden_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --default-timeout=100 --retries 5 -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://golden_ci:golden_ci@localhost:5432/golden_ci
          # Settings tu choi sentinel mac dinh cua 2 secret nay ngay luc import
          # (alembic env.py doc get_settings()) - runner self-hosted cu co san
          # trong moi truong nen truoc day khong lo ra.
          APP_ENV: test
          INTERNAL_AUTH_SECRET: test-internal-secret-for-ci-testing-only
          JWT_SECRET: test-jwt-secret-for-ci-testing-only

      - name: Seed the Agent V2 staging canary fixtures the golden set's fixture.patient references
        run: python scripts/agent_v2/seed_staging_agent_v2_data.py
        env:
          DATABASE_URL: postgresql://golden_ci:golden_ci@localhost:5432/golden_ci
          APP_ENV: test
          OPENAI_API_KEY: test-key
          INTERNAL_AUTH_SECRET: test-internal-secret-for-ci-testing-only
          JWT_SECRET: test-jwt-secret-for-ci-testing-only

      - name: Run golden-set deterministic-only smoke
        run: python scripts/agent_v2/run_golden_evaluation.py --deterministic-only --out-dir /tmp/golden-ci-out
        env:
          DATABASE_URL: postgresql://golden_ci:golden_ci@localhost:5432/golden_ci
          AGENT_RUNTIME_ENABLED: "true"
          APP_ENV: test
          OPENAI_API_KEY: test-key
          INTERNAL_AUTH_SECRET: test-internal-secret-for-ci-testing-only
          JWT_SECRET: test-jwt-secret-for-ci-testing-only

  # TASK-CAPY-26: cong chat luong cho test CAN Postgres that cua an toan lieu
  # (P0) va Capybara Companion (ADR-0016). Job `lint-and-test` o tren khong co
  # service Postgres nen cac test nay tu `skipif` -> SKIP am tham. Job nay dung
  # cung mau voi `golden-smoke` (pgvector:pg16, alembic upgrade head) va FAIL
  # neu co bat ky test nao bi skip, de "xanh" luon nghia la da chay that.
  # Host port 5433 (khong phai 5432) de khong dung `golden-smoke` khi 2 job chay
  # song song tren cung runner self-hosted.
  companion-db-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: capy_ci
          POSTGRES_PASSWORD: capy_ci
          POSTGRES_DB: capy_ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://capy_ci:capy_ci@localhost:5433/capy_ci
      APP_ENV: test
      OPENAI_API_KEY: test-key
      INTERNAL_AUTH_SECRET: test-internal-secret-for-ci-testing-only
      JWT_SECRET: test-jwt-secret-for-ci-testing-only

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --default-timeout=100 --retries 5 -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run dose-safety + companion DB tests (fail on any skip)
        run: |
          set -o pipefail
          pytest -q -rs -p no:randomly \
            tests/test_api/test_dose_status_rules.py \
            tests/test_dose_status_update.py \
            tests/services/test_dose_lifecycle_rules.py \
            tests/services/photo_verification/test_verifier.py \
            tests/services/photo_verification/test_evidence.py \
            tests/services/test_companion_progression.py \
            tests/services/test_companion_flag.py \
            tests/services/test_companion_service.py \
            tests/services/test_companion_reconcile.py \
            tests/test_api/test_companion_routes.py | tee pytest-db.txt
          if grep -Eq "[0-9]+ skipped" pytest-db.txt; then
            echo "::error::Co test bi SKIP - kiem tra ket noi Postgres/migration."
            exit 1
          fi
