# Build image frontend tren Cloud Build (ADR-0014).
#
# Can file nay thay vi `gcloud builds submit --tag`: NEXT_PUBLIC_* duoc Next.js
# nhung thang vao bundle JS luc `next build`, nen phai truyen qua --build-arg
# (xem frontend/Dockerfile). Doi API URL => phai build lai, khong chi redeploy.
#
# Chay tu thu muc frontend/ (scripts/deploy_gcp.ps1 lam viec nay):
#   gcloud builds submit --config ../deploy/gcp/cloudbuild.frontend.yaml \
#     --substitutions=_IMAGE=...,_API_URL=...,_SUPABASE_URL=...,_SUPABASE_ANON_KEY=...
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - .
images:
  - ${_IMAGE}
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
